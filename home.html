<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แปลภาษา - Translation App</title>
    <meta name="description" content="แอปแปลภาษาอังกฤษ-ไทย แปลข้อความได้ง่ายและรวดเร็ว">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <!-- ===== Navbar ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <!-- Hamburger for mobile -->
            <button class="hamburger" id="hamburger-btn" aria-label="เมนู">
                <span></span><span></span><span></span>
            </button>
        </div>

        <div class="nav-center">
            <div class="nav-tabs">
                <a href="home.html" class="nav-tab active" id="nav-translate"> แปลภาษา </a>

                <a href="add-vocab.html" class="nav-tab" id="nav-vocab"> เพิ่มคำศัพท์ </a>
            </div>
        </div>

        <div class="nav-right">
            <a href="login.html" class="btn-login" id="btn-login"> เข้าสู่ระบบ </a>
            <div class="profile-dropdown-container" id="user-info" style="display:none;">
                <button class="profile-avatar-btn" id="profile-avatar-btn" aria-haspopup="true" aria-expanded="false">
                    <span class="user-avatar" id="user-avatar">?</span>
                    <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>

                <div class="profile-dropdown-menu" id="profile-dropdown-menu">
                    <div class="dropdown-header">
                        <div class="dropdown-user-name" id="dropdown-user-name">User Name</div>
                        <div class="dropdown-user-email" id="dropdown-user-email">user@email.com</div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-links">
                        <a href="add-vocab.html" class="dropdown-item">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            <span>เพิ่มคำศัพท์ / ประวัติ</span>
                        </a>
                        <a href="admin.html" class="dropdown-item admin-item" id="dropdown-admin-link" style="display:none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            </svg>
                            <span>Admin Panel</span>
                        </a>
                    </div>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item logout-item" id="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        <span>ออกจากระบบ</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <main class="main-content">

        <!-- Hero Title -->
        <div class="hero-section">
            <h1 class="hero-title" id="hero-title">แปลภาษา</h1>
            <p class="hero-subtitle">แปลคำศัพท์เฉพาะทาง วิทยาการคอมพิวเตอร์ ได้เลย!!</p>
        </div>

        <!-- Translation Card -->
        <div class="translate-card" id="translate-card">

            <!-- Language Selector Bar -->
            <div class="lang-selector" id="lang-selector">
                <button class="lang-btn active" id="lang-source" data-lang="en">
                    <span class="lang-flag">🇬🇧</span>
                    English
                </button>

                <button class="swap-btn" id="swap-btn" title="สลับภาษา" aria-label="สลับภาษา">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9" />
                        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                        <polyline points="7 23 3 19 7 15" />
                        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                    </svg>
                    สลับ
                </button>

                <button class="lang-btn" id="lang-target" data-lang="th">
                    <span class="lang-flag">🇹🇭</span>
                    ภาษาไทย
                </button>
            </div>

            <!-- Translation Area -->
            <div class="translate-area" id="translate-area">

                <!-- Input Side -->
                <div class="translate-pane input-pane">
                    <textarea class="translate-input" id="source-text" placeholder="type some thing..."
                        maxlength="5000"></textarea>
                    <div class="pane-footer">
                        <div class="pane-actions-left">
                            <button class="icon-btn" id="btn-file" title="แนบไฟล์เอกสาร" aria-label="แนบไฟล์">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                                    <polyline points="14 2 14 8 20 8" />
                                </svg>
                            </button>
                            <button class="icon-btn" id="btn-image" title="แปลจากรูปภาพ" aria-label="แปลรูปภาพ">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                                    <circle cx="9" cy="9" r="2" />
                                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                                </svg>
                            </button>
                            <button class="icon-btn" id="btn-paste" title="วางข้อความ" aria-label="วางข้อความ">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
                                    <path
                                        d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                                </svg>
                            </button>
                            <button class="icon-btn" id="btn-clear" title="ล้างข้อความ" aria-label="ล้างข้อความ">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18" />
                                    <line x1="6" y1="6" x2="18" y2="18" />
                                </svg>
                            </button>
                            <!-- Hidden inputs for file/image upload -->
                            <input type="file" id="file-input" accept=".txt,.pdf,.doc,.docx" style="display:none">
                            <input type="file" id="image-input" accept="image/*" style="display:none">
                        </div>
                        <span class="char-count" id="char-count">0 / 5000</span>
                    </div>
                </div>

                <!-- Divider -->
                <div class="translate-divider"></div>

                <!-- Output Side -->
                <div class="translate-pane output-pane">
                    <div class="translate-output" id="target-text" aria-label="ผลการแปล">
                        <span class="output-placeholder">คำแปลจะแสดงที่นี่...</span>
                    </div>
                    <div class="pane-footer">
                        <div class="pane-actions-left">
                            <button class="icon-btn" id="btn-copy-output" title="คัดลอก" aria-label="คัดลอกผลแปล">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                                </svg>
                            </button>
                        </div>
                        <button class="copy-btn" id="btn-copy" title="คัดลอกผลแปล">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                            </svg>
                            คัดลอก
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer Info -->
        <div class="footer-info" id="footer-info">
            <button class="footer-link" id="btn-history">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                    <path d="M12 7v5l4 2" />
                </svg>
                ประวัติ
            </button>
        </div>

    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span class="toast-text" id="toast-text">คัดลอกแล้ว!</span>
    </div>

    <!-- 📦 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- 🔑 Supabase Config -->
    <script src="supabase-config.js"></script>
    <!-- 📝 Home Logic -->
    <script src="home.js"></script>
</body>

</html>
